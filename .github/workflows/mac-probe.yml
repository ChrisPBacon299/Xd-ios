# Step 1: build the port's own Mac (Apple silicon) version of Colosseum and XD, with no game files.
# This proves the toolchain works on GitHub's Macs and records how the build is laid out, before
# anything is changed for iOS. Nothing from any disc is used or stored here.
name: Mac probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mac-probe.yml
      - pins.env
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Make the draft release for the logs (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view probe -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create probe -R "$GITHUB_REPOSITORY" --draft --title "Build probe (private draft)" --notes "Logs and source snapshots for working on the iOS build. Draft: not public."
  probe:
    needs: release
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        game: [colosseum, xd]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned commits
        run: cat pins.env >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install cmake ninja llvm lld

      - name: Fetch the port, the decomp and the renderer
        run: |
          set -x
          fetch() { # url commit dir
            git init -q "$3" && git -C "$3" remote add origin "$1"
            git -C "$3" fetch -q --depth 1 origin "$2" && git -C "$3" checkout -q FETCH_HEAD
          }
          fetch "$PORT_REPO" "$PORT_COMMIT" port
          if [ "${{ matrix.game }}" = xd ]; then
            fetch "$XD_DECOMP_REPO" "$XD_DECOMP_COMMIT" port/deps/pkmn-xd
          else
            fetch "$COLO_DECOMP_REPO" "$COLO_DECOMP_COMMIT" port/deps/pkmn-colosseum
          fi
          ls port port/deps port/tools port/host | head -200

      - name: Apply the iOS changes
        run: |
          for p in patches/*.patch; do echo "applying $p"; git -C port apply --whitespace=nowarn "$PWD/$p"; done

      - name: Record the build layout
        run: |
          cd port
          mkdir -p ../probe
          for f in build.sh tools/link_macos.py tools/macos_deps.sh host/colo.h host/macos.c tools/ci/linux-build.sh; do
            [ -f "$f" ] && { echo "=== $f"; cat "$f"; } >> ../probe/layout.txt
          done
          git ls-files > ../probe/files.txt
          grep -n "arm64\|COLO_BASE\|__game\|mmap\|MAP_JIT\|PROT_EXEC" host/macos.c host/colo.h 2>/dev/null | head -200 || true

      - name: Restore compiled game units
        uses: actions/cache/restore@v4
        with:
          path: unit-cache
          key: units-${{ matrix.game }}-${{ github.sha }}
          restore-keys: units-${{ matrix.game }}-

      - name: Build (Mac, arm64)
        env:
          COLO_GAME: ${{ matrix.game == 'xd' && 'xd' || '' }}
        run: |
          cd port
          export COLO_PORT="$PWD" SMS_PORT="$PWD/deps/sms-pc-port" COLO_UNIT_CACHE="$GITHUB_WORKSPACE/unit-cache"
          mkdir -p "$COLO_UNIT_CACHE"
          if [ "${{ matrix.game }}" = xd ]; then export DECOMP="$PWD/deps/pkmn-xd"
          else
            export DECOMP="$PWD/deps/pkmn-colosseum"
            (cd "$DECOMP" && python3 configure.py > /dev/null)
          fi
          set -o pipefail
          /bin/sh ./build.sh 2>&1 | tee ../probe/build.log
          ls -la build | tee -a ../probe/build.log

      - name: Save compiled game units
        if: always()
        uses: actions/cache/save@v4
        with:
          path: unit-cache
          key: units-${{ matrix.game }}-${{ github.sha }}

      - name: Start it with no disc (checks the code loads and runs from the executable)
        if: always()
        run: |
          cd port
          exe=$(ls build/colosseum build/xd build/xd-game/xd 2>/dev/null | head -1)
          echo "running $exe"
          SMS_HEADLESS=1 SDL_VIDEODRIVER=offscreen perl -e 'alarm 60; exec @ARGV' "./$exe" 2>&1 | tail -20 | tee ../probe/run.log || true
          grep -q "disc image needed" ../probe/run.log && echo "LOADER OK" | tee -a ../probe/run.log

      - name: Report the end of the logs (as annotations, readable through the API)
        if: always()
        run: |
          report() { # title file lines
            [ -f "$2" ] || return 0
            body=$(grep -v '^\[[0-9]*/[0-9]*\]' "$2" | tail -n "$3" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=$1::$body"
          }
          report "build log (${{ matrix.game }})" probe/build.log 40
          grep -n -i -E "error|cannot|failed|undefined|code holds|addresses|such as|SystemExit|Traceback|game code|refus" probe/build.log | grep -v -E "warning:|Wdeprecated|Looking for|Performing Test" | tail -60 > probe/errors.txt || true
          report "errors (${{ matrix.game }})" probe/errors.txt 60
          report "run (${{ matrix.game }})" probe/run.log 30

      - name: Keep the logs and a source snapshot (draft release, not public)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf probe/source-${{ matrix.game }}.tar.gz --exclude=.git --exclude=build --exclude='orig' --exclude='*.iso' port
          for f in probe/*; do mv "$f" "probe/${{ matrix.game }}-$(basename "$f" | sed 's/^source-${{ matrix.game }}/source/')"; done
          for f in probe/*; do gh release upload probe "$f" -R "$GITHUB_REPOSITORY" --clobber || echo "could not upload $f"; done
