# A tiny test app: which memory layouts iOS allows on the actual phone. Builds an unsigned IPA
# (ad-hoc signed with the entitlements, for the sideloader to re-sign) and puts it on the
# "test-builds" release. No game code or data.
name: VM probe app
on:
  workflow_dispatch:
  push:
    paths:
      - tests/vmprobe/**
      - .github/workflows/vmprobe.yml
permissions:
  contents: write
jobs:
  build:
    # the newest Xcode: the iPhone Duo lays out an app natively only when it was built with the iOS 27.1 SDK or newer
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode (iOS 27.1 SDK or newer)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Xcode $X, iOS SDK $SDK"
          echo "::notice title=SDK::Xcode $(basename $X), iOS SDK $SDK"
          printf '%s\n27.1\n' "$SDK" | sort -V -C -r || { echo "::error::iOS SDK $SDK is older than 27.1"; exit 1; }
          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"
      - name: Build the IPA
        run: |
          set -e
          APP=build/Payload/VMProbe.app
          mkdir -p "$APP"
          xcrun -sdk iphoneos clang -target arm64-apple-ios16.0 -fobjc-arc -O1 \
            -DIOS_SDK=\"$IOS_SDK\" tests/vmprobe/main.m -framework UIKit -framework Foundation -o "$APP/VMProbe"
          cp tests/vmprobe/Info.plist "$APP/Info.plist"
          plutil -convert binary1 "$APP/Info.plist"
          codesign -f -s - --entitlements tests/vmprobe/entitlements.plist "$APP"
          (cd build && zip -qry ../VMProbe.ipa Payload)
          ls -la VMProbe.ipa
      - name: Publish to the test-builds release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-builds >/dev/null 2>&1 || \
            gh release create test-builds --prerelease --title "Test builds" --notes "Small test apps for checking iOS behaviour. No game code or data."
          gh release upload test-builds VMProbe.ipa --clobber
